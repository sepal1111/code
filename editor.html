<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找到寶藏吧！地圖編輯器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');

        body {
            font-family: 'Noto Sans TC', Arial, sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }

        .editor-grid-cell {
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .editor-grid-cell:hover {
            background-color: rgba(14, 165, 233, 0.1);
        }

        .tool-btn {
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .tool-btn.active {
            border-color: #0ea5e9;
            background-color: #e0f2fe;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .ocean-bg {
            background-color: #0ea5e9;
            background-image: radial-gradient(#38bdf8 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .portal-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            transform-origin: left center;
            pointer-events: none;
            z-index: 5;
            opacity: 0.6;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .active-placement {
            animation: pulse 1s infinite;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center p-4">

    <header class="text-center mb-8 w-full max-w-6xl">
        <div class="flex justify-between items-center bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <div class="text-left">
                <h1 class="text-3xl font-bold text-slate-800">🛠️ 地圖編輯器</h1>
                <p class="text-slate-500">設計你的專屬冒險關卡</p>
            </div>
            <div class="flex gap-3">
                <a href="index.html" class="px-6 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition">返回遊戲</a>
                <button onclick="exportMap()" class="px-6 py-2 bg-sky-600 text-white rounded-xl font-bold hover:bg-sky-700 shadow-lg shadow-sky-200 transition">匯出地圖</button>
                <button onclick="launchCustomGame()" class="px-6 py-2 bg-amber-500 text-white rounded-xl font-bold hover:bg-amber-600 shadow-lg shadow-amber-200 transition">🚀 開始測試</button>
            </div>
        </div>
    </header>

    <main class="flex flex-col lg:flex-row gap-8 w-full max-w-7xl items-start">
        
        <!-- 左側工具欄 -->
        <aside class="w-full lg:w-72 flex flex-col gap-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <span>📏 地圖大小</span>
                </h2>
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-sm font-medium text-slate-500 mb-2">
                            <span>寬度 & 高度</span>
                            <span id="size-val">9 x 9</span>
                        </div>
                        <input type="range" id="size-slider" min="5" max="12" value="9" 
                            oninput="updateSize(this.value)"
                            class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-600">
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <span>🎨 編輯工具</span>
                </h2>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="selectTool('start')" id="tool-start" class="tool-btn flex flex-col items-center p-2 bg-slate-50 rounded-xl text-slate-700 active">
                        <span class="text-xl">🚩</span>
                        <span class="text-[10px] mt-1 font-bold">起點</span>
                    </button>
                    <button onclick="selectTool('end')" id="tool-end" class="tool-btn flex flex-col items-center p-2 bg-slate-50 rounded-xl text-slate-700">
                        <span class="text-xl">💰</span>
                        <span class="text-[10px] mt-1 font-bold">終點</span>
                    </button>
                    <button onclick="selectTool('obstacle')" id="tool-obstacle" class="tool-btn flex flex-col items-center p-2 bg-slate-50 rounded-xl text-slate-700">
                        <span class="text-xl">🪨</span>
                        <span class="text-[10px] mt-1 font-bold">障礙物</span>
                    </button>
                    <button onclick="selectTool('driftwood')" id="tool-driftwood" class="tool-btn flex flex-col items-center p-2 bg-slate-50 rounded-xl text-slate-700">
                        <span class="text-xl">🪵</span>
                        <span class="text-[10px] mt-1 font-bold">浮木</span>
                    </button>
                    <button onclick="selectTool('portal-p')" id="tool-portal-p" class="tool-btn flex flex-col items-center p-2 bg-slate-50 rounded-xl text-slate-700">
                        <span class="text-xl">🟣</span>
                        <span class="text-[10px] mt-1 font-bold">紫傳送</span>
                    </button>
                    <button onclick="selectTool('portal-g')" id="tool-portal-g" class="tool-btn flex flex-col items-center p-2 bg-slate-50 rounded-xl text-slate-700">
                        <span class="text-xl">🟢</span>
                        <span class="text-[10px] mt-1 font-bold">綠傳送</span>
                    </button>
                    <button onclick="selectTool('portal-b')" id="tool-portal-b" class="tool-btn flex flex-col items-center p-2 bg-slate-50 rounded-xl text-slate-700">
                        <span class="text-xl">🔵</span>
                        <span class="text-[10px] mt-1 font-bold">藍傳送</span>
                    </button>
                    <button onclick="selectTool('key')" id="tool-key" class="tool-btn flex flex-col items-center p-2 bg-slate-50 rounded-xl text-slate-700">
                        <span class="text-xl">🔑</span>
                        <span class="text-[10px] mt-1 font-bold">金鑰</span>
                    </button>
                    <button onclick="selectTool('eraser')" id="tool-eraser" class="tool-btn flex flex-col items-center p-2 bg-slate-50 rounded-xl text-slate-700 col-span-2">
                        <span class="text-xl">🧹</span>
                        <span class="text-[10px] mt-1 font-bold">橡皮擦</span>
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <p id="tool-hint" class="text-[10px] text-slate-400 leading-tight">
                    * 點擊地圖放置物件<br>
                    * 傳送門必須成對出現 (每色最多2個)<br>
                    * 浮木可被射擊摧毀，鑰匙只能有一個
                </p>
            </div>
        </aside>

        <!-- 地圖編輯區 -->
        <div class="flex-1 bg-white p-8 rounded-[40px] shadow-xl border border-slate-100 flex items-center justify-center min-h-[600px] relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-[0.03] pointer-events-none">
                <svg width="100%" height="100%">
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"/>
                    </pattern>
                    <rect width="100%" height="100%" fill="url(#grid)" />
                </svg>
            </div>

            <div id="editor-board" class="ocean-bg rounded-2xl shadow-2xl relative border-4 border-slate-800 ring-8 ring-slate-100 transition-all duration-300">
                <div id="portal-lines-container" class="absolute inset-0 pointer-events-none z-5"></div>
            </div>
        </div>

        <!-- 右側工具欄 -->
        <aside class="w-full lg:w-72 flex flex-col gap-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <span>📑 指令卡片設定</span>
                </h2>
                <div class="space-y-2">
                    <!-- 表頭 -->
                    <div class="flex items-center justify-between text-xs text-slate-400 pb-1 border-b border-slate-100">
                        <span>指令與啟用</span>
                        <span>限制數量 (0=無限制)</span>
                    </div>
                    <!-- 前進 -->
                    <div class="flex items-center justify-between gap-1 py-0.5">
                        <div class="flex items-center gap-1.5">
                            <input type="checkbox" id="enable-forward" onchange="updateLimits()" class="w-4 h-4 text-sky-600 border-slate-300 rounded focus:ring-sky-500" checked>
                            <span class="text-xs text-slate-600 font-bold">⬆️ 前進</span>
                        </div>
                        <input type="number" id="limit-forward" value="0" min="0" onchange="updateLimits()" class="w-16 px-2 py-0.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-center">
                    </div>
                    <!-- 後退 -->
                    <div class="flex items-center justify-between gap-1 py-0.5">
                        <div class="flex items-center gap-1.5">
                            <input type="checkbox" id="enable-backward" onchange="updateLimits()" class="w-4 h-4 text-sky-600 border-slate-300 rounded focus:ring-sky-500" checked>
                            <span class="text-xs text-slate-600 font-bold">⬇️ 後退</span>
                        </div>
                        <input type="number" id="limit-backward" value="0" min="0" onchange="updateLimits()" class="w-16 px-2 py-0.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-center">
                    </div>
                    <!-- 左轉 -->
                    <div class="flex items-center justify-between gap-1 py-0.5">
                        <div class="flex items-center gap-1.5">
                            <input type="checkbox" id="enable-left" onchange="updateLimits()" class="w-4 h-4 text-sky-600 border-slate-300 rounded focus:ring-sky-500" checked>
                            <span class="text-xs text-slate-600 font-bold">↪️ 左轉</span>
                        </div>
                        <input type="number" id="limit-left" value="0" min="0" onchange="updateLimits()" class="w-16 px-2 py-0.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-center">
                    </div>
                    <!-- 右轉 -->
                    <div class="flex items-center justify-between gap-1 py-0.5">
                        <div class="flex items-center gap-1.5">
                            <input type="checkbox" id="enable-right" onchange="updateLimits()" class="w-4 h-4 text-sky-600 border-slate-300 rounded focus:ring-sky-500" checked>
                            <span class="text-xs text-slate-600 font-bold">↩️ 右轉</span>
                        </div>
                        <input type="number" id="limit-right" value="0" min="0" onchange="updateLimits()" class="w-16 px-2 py-0.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-center">
                    </div>
                    <!-- 射擊 -->
                    <div class="flex items-center justify-between gap-1 py-0.5">
                        <div class="flex items-center gap-1.5">
                            <input type="checkbox" id="enable-shoot" onchange="updateLimits()" class="w-4 h-4 text-sky-600 border-slate-300 rounded focus:ring-sky-500" checked>
                            <span class="text-xs text-slate-600 font-bold">🎯 射擊</span>
                        </div>
                        <input type="number" id="limit-shoot" value="0" min="0" onchange="updateLimits()" class="w-16 px-2 py-0.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-center">
                    </div>
                    
                    <div class="py-1 border-t border-slate-100 my-1"></div>

                    <!-- 重複 x2 -->
                    <div class="flex items-center justify-between gap-1 py-0.5">
                        <div class="flex items-center gap-1.5">
                            <input type="checkbox" id="enable-repeat_2" onchange="updateLimits()" class="w-4 h-4 text-sky-600 border-slate-300 rounded focus:ring-sky-500" checked>
                            <span class="text-xs text-slate-600 font-bold">🔁 x2 重複</span>
                        </div>
                        <input type="number" id="limit-repeat_2" value="0" min="0" onchange="updateLimits()" class="w-16 px-2 py-0.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-center">
                    </div>
                    <!-- 重複 x3 -->
                    <div class="flex items-center justify-between gap-1 py-0.5">
                        <div class="flex items-center gap-1.5">
                            <input type="checkbox" id="enable-repeat_3" onchange="updateLimits()" class="w-4 h-4 text-sky-600 border-slate-300 rounded focus:ring-sky-500" checked>
                            <span class="text-xs text-slate-600 font-bold">🔁 x3 重複</span>
                        </div>
                        <input type="number" id="limit-repeat_3" value="0" min="0" onchange="updateLimits()" class="w-16 px-2 py-0.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-center">
                    </div>
                    <!-- 自訂重複 -->
                    <div class="flex items-center justify-between gap-1 py-0.5">
                        <div class="flex items-center gap-1.5">
                            <input type="checkbox" id="enable-repeat_custom" onchange="updateLimits()" class="w-4 h-4 text-sky-600 border-slate-300 rounded focus:ring-sky-500" checked>
                            <span class="text-xs text-slate-600 font-bold">🔁 自訂重複</span>
                        </div>
                        <input type="number" id="limit-repeat_custom" value="0" min="0" onchange="updateLimits()" class="w-16 px-2 py-0.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-center">
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <div class="flex flex-col gap-3">
                    <input type="text" id="map-name-input" placeholder="地圖名稱..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                    <textarea id="map-desc-input" placeholder="地圖說明 (選填)..." rows="2" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 resize-none"></textarea>
                    <button onclick="saveMap()" class="w-full bg-sky-600 text-white py-2 rounded-xl text-sm font-bold hover:bg-sky-700 transition active:scale-95">💾 儲存地圖到庫中</button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex-1 min-h-[300px] flex flex-col">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <span>🌍 我的地圖庫</span>
                </h2>
                <div id="saved-maps-list" class="flex-1 overflow-y-auto space-y-2 max-h-[400px] pr-2 custom-scrollbar">
                    <!-- 地圖列表將顯示在此 -->
                    <p class="text-xs text-slate-400 text-center py-8">尚無儲存的地圖</p>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-100 flex flex-col gap-2">
                    <button onclick="importMapPrompt()" class="w-full py-2 bg-slate-50 text-slate-600 rounded-xl font-bold hover:bg-slate-100 transition text-xs">📥 匯入地圖代碼</button>
                    <button onclick="clearMap()" class="w-full py-2 text-red-400 rounded-xl font-bold hover:bg-red-50 transition text-xs">🧹 清空目前地圖</button>
                </div>
            </div>
        </aside>

    </main>

    <!-- 匯入彈窗 -->
    <div id="import-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[210] p-4">
        <div class="bg-white p-8 rounded-[32px] max-w-lg w-full shadow-2xl border border-slate-100">
            <h2 class="text-xl font-bold text-slate-800 mb-2">📥 匯入地圖代碼</h2>
            <p class="text-sm text-slate-500 mb-4">請在下方貼上完整的地圖代碼：</p>
            <textarea id="import-textarea" class="w-full h-48 p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-sky-500 resize-none mb-6" placeholder="貼上代碼於此..."></textarea>
            <div class="flex gap-3">
                <button onclick="closeImportModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition">取消</button>
                <button onclick="confirmImport()" class="flex-1 py-3 bg-sky-600 text-white rounded-xl font-bold hover:bg-sky-700 shadow-lg shadow-sky-200 transition">確認匯入</button>
            </div>
        </div>
    </div>

    <!-- 訊息提示 -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-[200] font-medium flex items-center gap-3">
        <span id="toast-icon">✅</span>
        <span id="toast-msg">已複製地圖代碼</span>
    </div>

    <script>
        let gridSize = 9;
        let selectedTool = 'start';
        let mapData = {
            size: 9,
            startPos: { x: 4, y: 8 },
            endPos: { x: 4, y: 0 },
            obstacles: [],
            driftwoods: [],
            portals: [], // {x, y, color}
            keyPos: null,
            limits: { forward: 0, backward: 0, left: 0, right: 0, shoot: 0, repeat_2: 0, repeat_3: 0, repeat_custom: 0 },
            showRepeat: true,
            name: "",
            desc: ""
        };
        let savedMaps = JSON.parse(localStorage.getItem('pirate_saved_maps')) || [];

        function updateLimits() {
            const types = ['forward', 'backward', 'left', 'right', 'shoot', 'repeat_2', 'repeat_3', 'repeat_custom'];
            mapData.limits = {};
            types.forEach(type => {
                const enabled = document.getElementById(`enable-${type}`).checked;
                const limitVal = parseInt(document.getElementById(`limit-${type}`).value) || 0;
                
                document.getElementById(`limit-${type}`).disabled = !enabled;
                if (!enabled) {
                    document.getElementById(`limit-${type}`).classList.add('opacity-40');
                } else {
                    document.getElementById(`limit-${type}`).classList.remove('opacity-40');
                }
                
                mapData.limits[type] = enabled ? limitVal : -1;
            });
            
            // 自動計算 showRepeat
            mapData.showRepeat = (mapData.limits['repeat_2'] !== -1 || mapData.limits['repeat_3'] !== -1 || mapData.limits['repeat_custom'] !== -1);
        }

        function initEditor() {
            const board = document.getElementById('editor-board');
            board.innerHTML = '<div id="portal-lines-container" class="absolute inset-0 pointer-events-none z-5"></div>';
            board.style.display = 'grid';
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            
            const cellSize = Math.min(600 / gridSize, 60);
            board.style.width = `${cellSize * gridSize}px`;

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'editor-grid-cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    cell.onclick = () => handleCellClick(x, y);
                    
                    renderCellContent(cell, x, y);
                    board.appendChild(cell);
                }
            }
            renderPortalLines();

            // 同步 UI 狀態
            if (!mapData.limits) {
                mapData.limits = { forward: 0, backward: 0, left: 0, right: 0, shoot: 0, repeat_2: 0, repeat_3: 0, repeat_custom: 0 };
            }
            const types = ['forward', 'backward', 'left', 'right', 'shoot', 'repeat_2', 'repeat_3', 'repeat_custom'];
            types.forEach(type => {
                let limit = mapData.limits[type];
                
                // 相容性處理：如果舊地圖 limits 裡沒有某個 key，或者 showRepeat 為 false
                if (limit === undefined) {
                    if (type.startsWith('repeat')) {
                        limit = (mapData.showRepeat !== false) ? 0 : -1;
                    } else {
                        limit = 0;
                    }
                }
                
                const enabled = (limit !== -1);
                const limitVal = (limit === -1) ? 0 : limit;
                
                document.getElementById(`enable-${type}`).checked = enabled;
                document.getElementById(`limit-${type}`).value = limitVal;
                document.getElementById(`limit-${type}`).disabled = !enabled;
                if (!enabled) {
                    document.getElementById(`limit-${type}`).classList.add('opacity-40');
                } else {
                    document.getElementById(`limit-${type}`).classList.remove('opacity-40');
                }
            });
        }

        function renderCellContent(cell, x, y) {
            cell.innerHTML = '';
            
            if (mapData.startPos && mapData.startPos.x === x && mapData.startPos.y === y) {
                cell.innerHTML = '<span class="text-2xl drop-shadow-sm">🚩</span>';
            } else if (mapData.endPos && mapData.endPos.x === x && mapData.endPos.y === y) {
                cell.innerHTML = '<span class="text-2xl drop-shadow-sm">💰</span>';
            } else if (mapData.obstacles.some(o => o.x === x && o.y === y)) {
                cell.innerHTML = '<span class="text-2xl">🪨</span>';
            } else if (mapData.driftwoods && mapData.driftwoods.some(d => d.x === x && d.y === y)) {
                const delay = ((x + y) * 0.4 % 3).toFixed(1);
                cell.innerHTML = `<span class="text-2xl floating" style="animation-delay: -${delay}s">🪵</span>`;
            } else if (mapData.keyPos && mapData.keyPos.x === x && mapData.keyPos.y === y) {
                cell.innerHTML = '<span class="text-2xl">🔑</span>';
            } else {
                const portal = mapData.portals.find(p => p.x === x && p.y === y);
                if (portal) {
                    const icons = { 'purple': '🟣', 'green': '🟢', 'blue': '🔵' };
                    cell.innerHTML = `<span class="text-2xl">${icons[portal.color]}</span>`;
                }
            }
        }

        function handleCellClick(x, y) {
            if (selectedTool !== 'eraser') {
                removeFromMap(x, y);
            }

            switch (selectedTool) {
                case 'start':
                    mapData.startPos = { x, y };
                    break;
                case 'end':
                    mapData.endPos = { x, y };
                    break;
                case 'obstacle':
                    mapData.obstacles.push({ x, y });
                    break;
                case 'driftwood':
                    if (!mapData.driftwoods) mapData.driftwoods = [];
                    mapData.driftwoods.push({ x, y });
                    break;
                case 'key':
                    mapData.keyPos = { x, y };
                    break;
                case 'portal-p':
                case 'portal-g':
                case 'portal-b':
                    const color = selectedTool.split('-')[1] === 'p' ? 'purple' : (selectedTool.split('-')[1] === 'g' ? 'green' : 'blue');
                    const existingColorPortals = mapData.portals.filter(p => p.color === color);
                    if (existingColorPortals.length >= 2) {
                        // 移除最早的一個
                        const first = existingColorPortals[0];
                        mapData.portals = mapData.portals.filter(p => !(p.x === first.x && p.y === first.y));
                    }
                    mapData.portals.push({ x, y, color });
                    break;
                case 'eraser':
                    removeFromMap(x, y);
                    break;
            }
            refreshAllCells();
        }

        function removeFromMap(x, y) {
            if (mapData.startPos && mapData.startPos.x === x && mapData.startPos.y === y) mapData.startPos = null;
            if (mapData.endPos && mapData.endPos.x === x && mapData.endPos.y === y) mapData.endPos = null;
            
            mapData.obstacles = mapData.obstacles.filter(o => !(o.x === x && o.y === y));
            if (mapData.driftwoods) mapData.driftwoods = mapData.driftwoods.filter(d => !(d.x === x && d.y === y));
            mapData.portals = mapData.portals.filter(p => !(p.x === x && p.y === y));
            
            if (mapData.keyPos && mapData.keyPos.x === x && mapData.keyPos.y === y) mapData.keyPos = null;
        }

        function refreshAllCells() {
            const cells = document.querySelectorAll('.editor-grid-cell');
            cells.forEach(cell => {
                const x = parseInt(cell.dataset.x);
                const y = parseInt(cell.dataset.y);
                renderCellContent(cell, x, y);
            });
            renderPortalLines();
        }

        function renderPortalLines() {
            const container = document.getElementById('portal-lines-container');
            container.innerHTML = '';
            
            const colors = ['purple', 'green', 'blue'];
            const colorGradients = {
                'purple': 'linear-gradient(90deg, #a855f7, #c084fc)',
                'green': 'linear-gradient(90deg, #22c55e, #4ade80)',
                'blue': 'linear-gradient(90deg, #3b82f6, #60a5fa)'
            };

            colors.forEach(color => {
                const portals = mapData.portals.filter(p => p.color === color);
                if (portals.length === 2) {
                    const p1 = portals[0];
                    const p2 = portals[1];

                    const startCell = document.querySelector(`[data-x="${p1.x}"][data-y="${p1.y}"]`);
                    const endCell = document.querySelector(`[data-x="${p2.x}"][data-y="${p2.y}"]`);
                    
                    if (startCell && endCell) {
                        const line = document.createElement('div');
                        line.className = 'portal-line';
                        line.style.background = colorGradients[color];
                        
                        const r1 = startCell.getBoundingClientRect();
                        const r2 = endCell.getBoundingClientRect();
                        const boardRect = document.getElementById('editor-board').getBoundingClientRect();
                        
                        const x1 = r1.left + r1.width / 2 - boardRect.left;
                        const y1 = r1.top + r1.height / 2 - boardRect.top;
                        const x2 = r2.left + r2.width / 2 - boardRect.left;
                        const y2 = r2.top + r2.height / 2 - boardRect.top;
                        
                        const dist = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
                        const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
                        
                        line.style.width = `${dist}px`;
                        line.style.left = `${x1}px`;
                        line.style.top = `${y1}px`;
                        line.style.transform = `rotate(${angle}deg)`;
                        
                        container.appendChild(line);
                    }
                }
            });
        }

        function updateSize(val) {
            gridSize = parseInt(val);
            mapData.size = gridSize;
            document.getElementById('size-val').innerText = `${val} x ${val}`;
            
            // 修正超出的座標
            if (mapData.startPos && (mapData.startPos.x >= gridSize || mapData.startPos.y >= gridSize)) mapData.startPos = { x: 0, y: gridSize - 1 };
            if (mapData.endPos && (mapData.endPos.x >= gridSize || mapData.endPos.y >= gridSize)) mapData.endPos = { x: gridSize - 1, y: 0 };
            mapData.obstacles = mapData.obstacles.filter(o => o.x < gridSize && o.y < gridSize);
            mapData.portals = mapData.portals.filter(p => p.x < gridSize && p.y < gridSize && p.targetX < gridSize && p.targetY < gridSize);
            if (mapData.keyPos && (mapData.keyPos.x >= gridSize || mapData.keyPos.y >= gridSize)) mapData.keyPos = null;
            
            initEditor();
        }

        function selectTool(tool) {
            selectedTool = tool;
            portalPending = null;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
            refreshAllCells();
        }

        function exportMap() {
            if (!mapData.startPos || !mapData.endPos) {
                alert('⚠️ 警告：地圖上缺少起點（🚩）或終點（💰）！\n\n請在編輯器中先設定起點與終點，然後再執行匯出。');
                return;
            }
            updateLimits(); // 確保最新數值被包含
            mapData.name = document.getElementById('map-name-input').value.trim() || '自訂關卡';
            mapData.desc = document.getElementById('map-desc-input').value.trim() || '';
            
            const json = JSON.stringify(mapData);
            const encoded = btoa(unescape(encodeURIComponent(json)));
            navigator.clipboard.writeText(encoded).then(() => {
                showToast('已複製地圖代碼到剪貼簿', '✅');
            });
        }

        function importMapPrompt() {
            document.getElementById('import-textarea').value = '';
            document.getElementById('import-modal').classList.remove('hidden');
        }

        function closeImportModal() {
            document.getElementById('import-modal').classList.add('hidden');
        }

        function confirmImport() {
            const code = document.getElementById('import-textarea').value;
            if (code) {
                try {
                    const cleanCode = code.replace(/\s/g, ''); // 移除所有空白與換行
                    const json = decodeURIComponent(escape(atob(cleanCode)));
                    const data = JSON.parse(json);
                    
                    if (data && data.size) {
                        mapData = data;
                        // 確保相容性
                        if (!mapData.limits) mapData.limits = { forward: 0, backward: 0, left: 0, right: 0, shoot: 0, repeat_2: 0, repeat_3: 0, repeat_custom: 0 };
                        if (mapData.showRepeat === undefined) mapData.showRepeat = true;
                        
                        gridSize = mapData.size || 9;
                        document.getElementById('map-name-input').value = mapData.name || '';
                        document.getElementById('map-desc-input').value = mapData.desc || '';
                        document.getElementById('size-slider').value = gridSize;
                        document.getElementById('size-val').innerText = `${gridSize} x ${gridSize}`;
                        
                        closeImportModal();
                        initEditor();
                        showToast('地圖匯入成功', '✅');
                    } else {
                        throw new Error('無效的地圖資料結構');
                    }
                } catch (e) {
                    console.error('匯入地圖代碼失敗:', e);
                    showToast('代碼格式錯誤！', '❌');
                }
            }
        }

        function clearMap() {
            if (confirm('確定要清空目前的地圖嗎？')) {
                mapData = {
                    size: gridSize,
                    startPos: { x: 0, y: gridSize - 1 },
                    endPos: { x: gridSize - 1, y: 0 },
                    obstacles: [],
                    driftwoods: [],
                    portals: [],
                    keyPos: null,
                    limits: { forward: 0, backward: 0, left: 0, right: 0, shoot: 0, repeat_2: 0, repeat_3: 0, repeat_custom: 0 },
                    showRepeat: true
                };
                initEditor();
            }
        }

        function launchCustomGame() {
            if (!mapData.startPos || !mapData.endPos) {
                alert('⚠️ 警告：地圖上缺少起點（🚩）或終點（💰）！\n\n請在編輯器中先設定起點與終點，然後再開始測試。');
                return;
            }
            mapData.name = document.getElementById('map-name-input').value.trim() || '自訂關卡';
            mapData.desc = document.getElementById('map-desc-input').value.trim() || '這是一個自訂的地圖。';
            localStorage.setItem('pirate_custom_map', JSON.stringify(mapData));
            window.location.href = 'custom.html';
        }

        function showToast(msg, icon = '✅') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        window.onload = () => {
            initEditor();
            renderSavedMaps();
        };

        function saveMap() {
            if (!mapData.startPos || !mapData.endPos) {
                alert('⚠️ 警告：地圖上缺少起點（🚩）或終點（💰）！\n\n請在編輯器中先設定起點與終點，然後再儲存地圖。');
                return;
            }
            const nameInput = document.getElementById('map-name-input');
            const descInput = document.getElementById('map-desc-input');
            const name = nameInput.value.trim() || `未命名地圖 ${new Date().toLocaleDateString()}`;
            const desc = descInput.value.trim();
            
            mapData.name = name;
            mapData.desc = desc;
            
            const mapCode = btoa(unescape(encodeURIComponent(JSON.stringify(mapData))));
            const newMap = {
                id: Date.now(),
                name: name,
                desc: desc,
                code: mapCode,
                date: new Date().toLocaleString()
            };
            
            savedMaps.unshift(newMap);
            localStorage.setItem('pirate_saved_maps', JSON.stringify(savedMaps));
            
            nameInput.value = '';
            descInput.value = '';
            renderSavedMaps();
            showToast('✅ 地圖已儲存至庫中', '🎉');
        }

        function renderSavedMaps() {
            const list = document.getElementById('saved-maps-list');
            if (savedMaps.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">尚無儲存的地圖</p>';
                return;
            }
            
            list.innerHTML = savedMaps.map((map, index) => `
                <div class="group bg-slate-50 border border-slate-100 p-3 rounded-2xl hover:border-sky-200 hover:bg-sky-50/30 transition cursor-pointer relative" onclick="copyMapCode('${map.code}')">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-sm font-bold text-slate-700 truncate pr-6">${map.name}</span>
                        <button onclick="event.stopPropagation(); deleteMap(${map.id})" class="text-slate-300 hover:text-red-400 transition opacity-0 group-hover:opacity-100">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400">${map.date}</p>
                    <div class="mt-2 text-[10px] text-sky-600 font-bold flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                        <span>📋 點擊複製代碼</span>
                    </div>
                </div>
            `).join('');
        }

        function deleteMap(id) {
            if (confirm('確定要刪除此地圖嗎？')) {
                savedMaps = savedMaps.filter(m => m.id !== id);
                localStorage.setItem('pirate_saved_maps', JSON.stringify(savedMaps));
                renderSavedMaps();
            }
        }

        function copyMapCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                showToast('已複製地圖代碼');
            });
        }
        window.onresize = renderPortalLines;
    </script>
</body>

</html>
