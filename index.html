<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找到寶藏吧！邏輯遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');

        body {
            font-family: 'Noto Sans TC', Arial, sans-serif;
            background-color: #0ea5e9;
            background-image: radial-gradient(#38bdf8 1px, transparent 1px);
            background-size: 30px 30px;
            overflow: hidden;
        }

        .ship-option {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 4px solid transparent;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
        }

        .ship-option:hover {
            transform: translateY(-10px) scale(1.05);
            background-color: rgba(255, 255, 255, 0.2);
        }

        .ship-option.selected {
            border-color: #fbbf24;
            background-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        .floating-ship {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-4xl w-full text-white text-center">
        <div class="mb-12">
            <span class="text-6xl mb-6 block floating-ship">🚢</span>
            <h1 class="text-5xl font-black mb-4 tracking-tight">找到寶藏吧！</h1>
            <p class="text-sky-100 text-xl font-medium opacity-90">訓練邏輯思維的程式冒險遊戲</p>
        </div>

        <div class="glass-panel p-10 rounded-[40px] shadow-2xl mb-10">
            <h2 class="text-2xl font-bold mb-8 flex items-center justify-center gap-2">
                <span>⚓ 選擇你的冒險船隻</span>
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
                <div onclick="selectShip('🚢', 0)" class="ship-option bg-white/10 p-8 rounded-3xl text-7xl selected"
                    id="opt-0">🚢</div>
                <div onclick="selectShip('⛵', 1)" class="ship-option bg-white/10 p-8 rounded-3xl text-7xl" id="opt-1">⛵
                </div>
                <div onclick="selectShip('🛥️', 2)" class="ship-option bg-white/10 p-8 rounded-3xl text-7xl" id="opt-2">
                    🛥️</div>
                <div onclick="selectShip('🛶', 3)" class="ship-option bg-white/10 p-8 rounded-3xl text-7xl" id="opt-3">
                    🛶</div>
            </div>

            <button onclick="startGame()"
                class="w-full sm:w-auto bg-yellow-400 text-sky-900 px-16 py-5 rounded-2xl text-2xl font-black shadow-[0_10px_25px_rgba(251,191,36,0.4)] hover:bg-yellow-300 hover:scale-105 transition-all active:scale-95 mb-10">
                🎮 開始闖關冒險
            </button>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="custom.html"
                    class="bg-sky-500/80 text-white px-10 py-4 rounded-2xl text-lg font-bold border border-white/20 hover:bg-sky-400 transition-all flex items-center justify-center gap-2">
                    🌊 自訂挑戰
                </a>
                <a href="editor.html"
                    class="bg-sky-700/50 text-white px-10 py-4 rounded-2xl text-lg font-bold border border-white/10 hover:bg-sky-600 transition-all flex items-center justify-center gap-2">
                    🛠️ 地圖編輯器
                </a>
            </div>
        </div>

        <div class="mb-4">
            <a href="tutorial.html" class="inline-flex items-center gap-2 px-6 py-2 bg-white/20 hover:bg-white/30 text-white rounded-full text-sm font-bold backdrop-blur-sm transition-all border border-white/10">
                📖 遊戲說明指南
            </a>
        </div>

        <p class="text-sky-200/60 text-sm font-medium">
            本遊戲靈感來自程式邏輯桌遊<span class="font-bold text-yellow-400">《Coding Ocean：海霸》</span><br>
            背景音樂由<a class="text-sky-300" href="https://pixabay.com/zh/music/search/ocean/">Pixabay</a>提供<br>
            <span class="text-xs opacity-70 mt-2 block">發布日期：2026-05-12</span>
        </p>
    </div>

    <script>
        let selectedIcon = '🚢';

        function selectShip(icon, id) {
            selectedIcon = icon;
            document.querySelectorAll('.ship-option').forEach(el => el.classList.remove('selected'));
            document.getElementById(`opt-${id}`).classList.add('selected');

            // 播放簡單的按鈕音效 (如果需要)
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) { }
        }

        function startGame() {
            localStorage.setItem('pirate_ship_icon', selectedIcon);
            location.href = 'adventure.html';
        }

        // 初始化檢查
        window.onload = () => {
            const savedIcon = localStorage.getItem('pirate_ship_icon');
            if (savedIcon) {
                const icons = ['🚢', '⛵', '🛥️', '🛶'];
                const idx = icons.indexOf(savedIcon);
                if (idx !== -1) selectShip(savedIcon, idx);
            }
        };
    </script>
</body>

</html>
