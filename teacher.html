<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師評分管理 - 找到寶藏吧！</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', Arial, sans-serif; }
        .level-cell { min-width: 5.5rem; }
        .cleared-cell  { background: rgba(16,185,129,0.12); color: #34d399; }
        .locked-cell   { color: #475569; }
        .pending-cell  { color: #94a3b8; }
        tr:hover td { background: rgba(255,255,255,0.03); }
        @media print {
            #top-nav, #import-section, .no-print { display: none !important; }
            body { background: white; color: black; }
            .print-table th, .print-table td { border: 1px solid #ccc; color: black !important; background: white !important; }
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-white">

<!-- ===== 密碼閘門 ===== -->
<div id="gate" class="fixed inset-0 bg-gradient-to-br from-slate-900 via-sky-950 to-slate-900 flex items-center justify-center z-50 p-6">
    <div class="bg-white rounded-3xl p-10 max-w-sm w-full text-center shadow-2xl">
        <div class="text-7xl mb-4">🔐</div>
        <h1 class="text-2xl font-black text-slate-800 mb-1">教師管理系統</h1>
        <p class="text-slate-500 text-sm mb-4">找到寶藏吧！學生過關紀錄管理</p>
        <input id="pw-input" type="password" placeholder="輸入今日密碼" autocomplete="off"
            class="w-full border-2 border-slate-200 rounded-2xl px-4 py-3 text-center font-mono text-lg mb-2 focus:outline-none focus:border-sky-400 text-slate-800 tracking-widest"
            onkeydown="if(event.key==='Enter') checkPassword()">
        <p id="pw-error" class="text-red-500 text-xs mb-3 hidden">❌ 密碼錯誤，請再試一次。</p>
        <button onclick="checkPassword()" id="login-btn"
            class="w-full bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold py-3 rounded-2xl transition hover:from-sky-600 hover:to-blue-700 shadow-lg text-lg">
            進入管理頁面 →
        </button>
    </div>
</div>

<!-- ===== 主控台 ===== -->
<div id="dashboard" class="hidden min-h-screen">

    <!-- Top Nav -->
    <nav id="top-nav" class="bg-slate-800/90 backdrop-blur border-b border-white/10 px-6 py-4 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <span class="text-2xl">📊</span>
            <div>
                <h1 class="text-lg font-black text-white">教師評分管理</h1>
                <p class="text-xs text-slate-400">找到寶藏吧！學生過關紀錄系統</p>
            </div>
        </div>
        <div class="flex flex-wrap items-center gap-2 no-print">
            <span id="today-label" class="text-xs text-slate-400 font-mono"></span>
            <button onclick="exportCSV()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition flex items-center gap-1">📊 匯出 CSV</button>
            <button onclick="window.print()" class="px-4 py-2 bg-slate-600 hover:bg-slate-500 text-white text-xs font-bold rounded-xl transition">🖨️ 列印</button>
            <a href="index.html" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-bold rounded-xl transition">🏠 首頁</a>
        </div>
    </nav>

    <div class="p-6 max-w-screen-2xl mx-auto">

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-slate-800 rounded-2xl p-5 border border-white/5">
                <div class="text-3xl font-black text-white" id="stat-total">0</div>
                <div class="text-slate-400 text-sm mt-1">學生總數</div>
            </div>
            <div class="bg-slate-800 rounded-2xl p-5 border border-white/5">
                <div class="text-3xl font-black text-emerald-400" id="stat-all-clear">0</div>
                <div class="text-slate-400 text-sm mt-1">全部通關人數</div>
            </div>
            <div class="bg-slate-800 rounded-2xl p-5 border border-white/5">
                <div class="text-3xl font-black text-sky-400" id="stat-avg">—</div>
                <div class="text-slate-400 text-sm mt-1">平均通關關數</div>
            </div>
            <div class="bg-slate-800 rounded-2xl p-5 border border-white/5">
                <div class="text-3xl font-black text-amber-400" id="stat-classes">0</div>
                <div class="text-slate-400 text-sm mt-1">班級數</div>
            </div>
        </div>

        <!-- Import -->
        <div id="import-section" class="bg-slate-800 rounded-3xl p-6 mb-6 border border-white/5 no-print">
            <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
                <div>
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">📥 批量匯入學生進度代碼</h2>
                    <p class="text-slate-400 text-xs mt-1">每行貼上一個進度代碼，可同時匯入多筆。重複匯入同班級座號會自動更新紀錄。</p>
                </div>
                <button onclick="clearAllRecords()"
                    class="px-3 py-1.5 bg-red-900/40 hover:bg-red-800/60 text-red-300 text-xs font-bold rounded-xl border border-red-700/30 transition flex items-center gap-1">
                    🗑️ 清除所有紀錄
                </button>
            </div>
            <textarea id="bulk-codes" rows="5"
                class="w-full bg-slate-900 text-slate-200 font-mono text-xs border border-slate-600 rounded-2xl p-4 resize-y focus:outline-none focus:border-sky-500"
                placeholder="在此貼上一或多個學生進度代碼（每行一個）..."></textarea>
            <div class="flex flex-wrap items-center gap-3 mt-3">
                <button onclick="importCodes()"
                    class="px-6 py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl transition flex items-center gap-2">
                    ✅ 解析並匯入
                </button>
                <span id="import-feedback" class="text-sm text-slate-400"></span>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-slate-800 rounded-3xl overflow-hidden border border-white/5">
            <div class="flex flex-wrap items-center justify-between gap-3 px-6 py-4 border-b border-white/10 no-print">
                <h2 class="text-base font-bold text-white">📋 學生過關紀錄</h2>
                <div class="flex flex-wrap items-center gap-2">
                    <input id="filter-class" type="text" placeholder="篩選班級..."
                        class="bg-slate-900 border border-slate-600 text-slate-200 text-xs rounded-xl px-3 py-1.5 focus:outline-none focus:border-sky-500 w-28"
                        oninput="renderTable()">
                    <select id="sort-by" onchange="renderTable()"
                        class="bg-slate-900 border border-slate-600 text-slate-200 text-xs rounded-xl px-3 py-1.5 focus:outline-none">
                        <option value="class-seat">班級 + 座號</option>
                        <option value="unlocked-desc">通關數（高→低）</option>
                        <option value="unlocked-asc">通關數（低→高）</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm print-table">
                    <thead class="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider">
                        <tr>
                            <th class="px-4 py-3 text-left">班級</th>
                            <th class="px-4 py-3 text-left">座號</th>
                            <th class="px-4 py-3 text-center">通關數</th>
                            <th class="px-4 py-3 text-center level-cell">第一關</th>
                            <th class="px-4 py-3 text-center level-cell">第二關</th>
                            <th class="px-4 py-3 text-center level-cell">第三關</th>
                            <th class="px-4 py-3 text-center level-cell">第四關</th>
                            <th class="px-4 py-3 text-center level-cell">第五關</th>
                            <th class="px-4 py-3 text-center level-cell">第六關</th>
                            <th class="px-4 py-3 text-center level-cell">第七關</th>
                            <th class="px-4 py-3 text-center no-print">操作</th>
                        </tr>
                    </thead>
                    <tbody id="student-tbody">
                        <tr id="empty-row">
                            <td colspan="11" class="text-center py-20 text-slate-500">
                                <div class="text-5xl mb-3">📭</div>
                                <div class="text-base">尚未匯入任何學生紀錄</div>
                                <div class="text-xs mt-1">在上方貼上進度代碼後點擊「解析並匯入」</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
// ========== 密碼驗證 ==========
function checkPassword() {
    const now = new Date();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const expected = `code${mm}${dd}`;
    const input = document.getElementById('pw-input').value;
    if (input === expected) {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('dashboard').classList.remove('hidden');
        initDashboard();
    } else {
        document.getElementById('pw-error').classList.remove('hidden');
        document.getElementById('pw-input').value = '';
        document.getElementById('pw-input').focus();
    }
}

// ========== 代碼解析（與 adventure.html 相同邏輯） ==========
const CMD_LONG = { F:'forward', B:'backward', L:'left', R:'right', S:'shoot', R2:'repeat_2', R3:'repeat_3' };

function deserializeProgram(str) {
    if (!str || !str.trim()) return null;
    const result = str.split(',').map(tok => {
        // 解析 wrap，例如 "R2w3" → type=repeat_2, wrap=3
        // "RN4w3" → type=repeat_custom, count=4, wrap=3
        const wIdx = tok.indexOf('w');
        let key = tok, wrap = 1;
        if (wIdx !== -1) { key = tok.slice(0, wIdx); wrap = parseInt(tok.slice(wIdx + 1)) || 1; }
        
        let type;
        let count = undefined;
        if (key.startsWith('RN')) {
            type = 'repeat_custom';
            count = parseInt(key.slice(2)) || 4;
        } else {
            type = CMD_LONG[key];
        }
        if (!type) return null;
        const cmd = { type, wrap };
        if (count !== undefined) cmd.count = count;
        return cmd;
    }).filter(Boolean);
    return result.length > 0 ? result : null;
}

function parseProgressCode(code) {
    try {
        const padded = code.trim().replace(/-/g, '+').replace(/_/g, '/') +
                       '==='.slice(0, (4 - code.trim().length % 4) % 4);
        const json = decodeURIComponent(escape(atob(padded)));
        const data = JSON.parse(json);
        if (data.v !== 1) throw new Error('version');
        return data;
    } catch(e) { return null; }
}

function countBlocks(prog) {
    if (!prog) return 0;
    return prog.length;
}

// ========== 學生紀錄 ==========
let studentRecords = [];  // [{ key, cls, seat, unlockedLevel, gameCleared, levelPrograms, rawCode }]

const TOTAL_LEVELS = 7;

function loadRecords() {
    try {
        const saved = localStorage.getItem('teacher_student_records');
        if (saved) studentRecords = JSON.parse(saved);
    } catch(e) { studentRecords = []; }
}

function saveRecords() {
    localStorage.setItem('teacher_student_records', JSON.stringify(studentRecords));
}

function importCodes() {
    const raw = document.getElementById('bulk-codes').value.trim();
    if (!raw) { setFeedback('⚠️ 請先貼上進度代碼。', 'text-amber-400'); return; }

    const lines = raw.split(/[\n\r]+/).map(l => l.trim()).filter(Boolean);
    let ok = 0, fail = 0;

    lines.forEach(line => {
        const data = parseProgressCode(line);
        if (!data) { fail++; return; }

        const cls  = (data.c || '').trim();
        const seat = (data.s || '').trim();
        const key  = `${cls}__${seat}`;

        const programs = [];
        const rawList = data.p || [];
        for (let i = 0; i < TOTAL_LEVELS; i++) {
            programs.push(deserializeProgram(rawList[i] || ''));
        }

        const rec = {
            key, cls, seat,
            unlockedLevel: Math.min(data.u || 0, TOTAL_LEVELS - 1),
            gameCleared: data.g === 1,
            levelPrograms: programs,
            rawCode: line,
            importedAt: new Date().toLocaleTimeString()
        };

        const idx = studentRecords.findIndex(r => r.key === key);
        if (idx >= 0) studentRecords[idx] = rec;
        else studentRecords.push(rec);
        ok++;
    });

    saveRecords();
    renderTable();
    updateStats();
    document.getElementById('bulk-codes').value = '';
    setFeedback(`✅ 成功匯入 ${ok} 筆${fail > 0 ? `，${fail} 筆格式錯誤已略過` : ''}。`, ok > 0 ? 'text-emerald-400' : 'text-amber-400');
}

function clearAllRecords() {
    if (!confirm('確定要清除所有學生紀錄？此操作無法復原。')) return;
    studentRecords = [];
    saveRecords();
    renderTable();
    updateStats();
    setFeedback('🗑️ 已清除所有紀錄。', 'text-slate-400');
}

function removeRecord(key) {
    studentRecords = studentRecords.filter(r => r.key !== key);
    saveRecords();
    renderTable();
    updateStats();
}

function setFeedback(msg, cls) {
    const el = document.getElementById('import-feedback');
    el.className = `text-sm font-bold ${cls}`;
    el.innerText = msg;
}

// ========== 表格渲染 ==========
const LEVEL_NAMES = ['一','二','三','四','五','六','七'];

function getClearedCount(rec) {
    return rec.levelPrograms.filter(p => p && p.length > 0).length;
}

function renderTable() {
    const tbody = document.getElementById('student-tbody');
    const filterCls = document.getElementById('filter-class').value.trim().toLowerCase();
    const sortBy = document.getElementById('sort-by').value;

    let records = studentRecords.filter(r =>
        !filterCls || r.cls.toLowerCase().includes(filterCls)
    );

    records.sort((a, b) => {
        if (sortBy === 'class-seat') {
            return a.cls.localeCompare(b.cls, 'zh-TW') || a.seat.localeCompare(b.seat, 'zh-TW');
        } else if (sortBy === 'unlocked-desc') {
            return getClearedCount(b) - getClearedCount(a);
        } else {
            return getClearedCount(a) - getClearedCount(b);
        }
    });

    if (records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="text-center py-20 text-slate-500">
            <div class="text-5xl mb-3">📭</div>
            <div>${filterCls ? '找不到符合班級的學生' : '尚未匯入任何學生紀錄'}</div>
        </td></tr>`;
        return;
    }

    tbody.innerHTML = records.map(rec => {
        const cleared = getClearedCount(rec);
        const pct = Math.round(cleared / TOTAL_LEVELS * 100);

        const levelCells = rec.levelPrograms.map((prog, i) => {
            if (prog && prog.length > 0) {
                return `<td class="px-3 py-3 text-center level-cell cleared-cell">
                    <div class="font-bold">✅</div>
                    <div class="text-[10px] opacity-80">${prog.length} 塊</div>
                </td>`;
            } else if (i <= rec.unlockedLevel) {
                return `<td class="px-3 py-3 text-center level-cell pending-cell">
                    <div class="text-base">○</div><div class="text-[10px]">未完成</div>
                </td>`;
            } else {
                return `<td class="px-3 py-3 text-center level-cell locked-cell">
                    <div class="text-base">🔒</div>
                </td>`;
            }
        }).join('');

        const progressBar = `<div class="w-12 h-1.5 bg-slate-700 rounded-full overflow-hidden mx-auto mt-1">
            <div class="h-full rounded-full ${cleared === TOTAL_LEVELS ? 'bg-emerald-400' : 'bg-sky-400'}" style="width:${pct}%"></div>
        </div>`;

        const viewUrl = `adventure.html?studentCode=${encodeURIComponent(rec.rawCode)}`;

        return `<tr class="border-t border-white/5">
            <td class="px-4 py-3 font-bold text-white">${rec.cls || '<span class="text-slate-500">—</span>'}</td>
            <td class="px-4 py-3 font-bold text-white">${rec.seat || '<span class="text-slate-500">—</span>'}</td>
            <td class="px-3 py-3 text-center">
                <span class="font-black text-lg ${cleared === TOTAL_LEVELS ? 'text-emerald-400' : 'text-sky-400'}">${cleared}</span>
                <span class="text-slate-500 text-xs">/${TOTAL_LEVELS}</span>
                ${progressBar}
            </td>
            ${levelCells}
            <td class="px-3 py-3 text-center no-print">
                <div class="flex flex-col gap-1 items-center">
                    <a href="${viewUrl}" target="_blank"
                        class="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white text-[11px] font-bold rounded-lg transition whitespace-nowrap">
                        👁️ 查看
                    </a>
                    <button onclick="removeRecord('${rec.key}')"
                        class="px-3 py-1 bg-red-900/40 hover:bg-red-800/60 text-red-300 text-[11px] font-bold rounded-lg transition whitespace-nowrap border border-red-700/20">
                        🗑️ 移除
                    </button>
                </div>
            </td>
        </tr>`;
    }).join('');
}

// ========== 統計 ==========
function updateStats() {
    const total = studentRecords.length;
    const allClear = studentRecords.filter(r => r.gameCleared || getClearedCount(r) === TOTAL_LEVELS).length;
    const avgCleared = total > 0
        ? (studentRecords.reduce((s, r) => s + getClearedCount(r), 0) / total).toFixed(1)
        : '—';
    const classes = new Set(studentRecords.map(r => r.cls).filter(Boolean)).size;

    document.getElementById('stat-total').innerText = total;
    document.getElementById('stat-all-clear').innerText = allClear;
    document.getElementById('stat-avg').innerText = avgCleared;
    document.getElementById('stat-classes').innerText = classes;
}

// ========== 匯出 CSV ==========
function exportCSV() {
    const header = ['班級','座號','通關數','全部通關','第一關(塊)','第二關(塊)','第三關(塊)','第四關(塊)','第五關(塊)','第六關(塊)','第七關(塊)'];
    const rows = studentRecords.map(r => {
        const cleared = getClearedCount(r);
        const levelData = r.levelPrograms.map(p => p ? p.length : '');
        return [r.cls, r.seat, cleared, r.gameCleared ? '是' : '否', ...levelData];
    });
    const csv = [header, ...rows].map(row => row.map(v => `"${v}"`).join(',')).join('\n');
    const bom = '\uFEFF'; // UTF-8 BOM for Excel
    const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const now = new Date();
    a.download = `找到寶藏_學生成績_${now.getMonth()+1}${String(now.getDate()).padStart(2,'0')}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
}

// ========== 初始化 ==========
function initDashboard() {
    const now = new Date();
    document.getElementById('today-label').innerText =
        `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} 今日密碼：code${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    loadRecords();
    renderTable();
    updateStats();
}
</script>
</body>
</html>
